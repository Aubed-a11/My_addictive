server:
  port: 8083
spring:
  datasource:
    # Base unique SQLite partagee par tous les services (volume Docker commun).
    # Les tables de ce service sont prefixees "musique_" (voir PrefixedNamingStrategy).
    # WAL + busy_timeout : plusieurs services peuvent ecrire dans le meme fichier ;
    # transaction_mode=IMMEDIATE evite les erreurs de verrou lors d'une lecture
    # suivie d'une ecriture dans la meme transaction.
    url: jdbc:sqlite:${APP_DB_PATH:/app/shared-db/myaddictive.db}?journal_mode=WAL&busy_timeout=30000&transaction_mode=IMMEDIATE&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 3
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: bj.myaddictive.musique.config.PrefixedNamingStrategy
    show-sql: false
