# Prometheus : collecte toutes les 15 secondes
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # L'application (compte, media, musique, live, votes, boutique, paiement regroupes) et la passerelle
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app-service:8080']
        labels: {service: 'app'}
      - targets: ['gateway-service:8090']
        labels: {service: 'gateway'}

  # Le serveur (CPU, memoire, disque)
  - job_name: serveur
    static_configs:
      - targets: ['node-exporter:9100']

  # Les conteneurs Docker (memoire et CPU par conteneur)
  - job_name: conteneurs
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
