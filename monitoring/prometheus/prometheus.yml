# Prometheus : collecte toutes les 15 secondes
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Les services Spring Boot (reseau Docker de l'application, via Actuator + Micrometer)
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['compte-service:8091']
        labels: {service: 'compte'}
      - targets: ['media-service:8082']
        labels: {service: 'media'}
      - targets: ['musique-service:8083']
        labels: {service: 'musique'}
      - targets: ['live-service:8084']
        labels: {service: 'live'}
      - targets: ['votes-service:8085']
        labels: {service: 'votes'}
      - targets: ['boutique-service:8086']
        labels: {service: 'boutique'}
      - targets: ['paiement-service:8087']
        labels: {service: 'paiement'}
      - targets: ['gateway-service:8090']
        labels: {service: 'gateway'}

  # Le serveur (CPU, memoire, disque)
  - job_name: serveur
    static_configs:
      - targets: ['node-exporter:9100']

  # Les conteneurs Docker (memoire et CPU par conteneur)
  - job_name: conteneurs
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
