# Modele : devops/monitoring.sh genere alertmanager.yml a partir de .env.production
# (MAIL_USERNAME, MAIL_PASSWORD, ALERTE_EMAIL). Le fichier genere contient un mot de passe : il n'est jamais envoye sur Git.
global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '@@MAIL_USERNAME@@'
  smtp_auth_username: '@@MAIL_USERNAME@@'
  smtp_auth_password: '@@MAIL_PASSWORD@@'
  smtp_require_tls: true

route:
  receiver: email
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: '@@ALERTE_EMAIL@@'
        send_resolved: true
