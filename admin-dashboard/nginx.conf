server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application "single page" (React Router) : toute route inconnue doit
    # retomber sur index.html pour laisser React Router gerer la navigation
    # cote client (sinon un F5 sur /evenements donnerait un 404 Nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques : mise en cache longue duree (noms de fichiers
    # "hashes" par Vite a chaque build, donc pas de risque de contenu perime).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
