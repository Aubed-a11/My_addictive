# Dependabot : seulement les corrections (patch) et mises a jour mineures, une fois par mois.
# Les changements de version MAJEURE (Java 25, Node 26, Spring Cloud 2025, etc.) cassent le projet :
# ils se font a la main, volontairement, jamais automatiquement.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/mobile-app"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
