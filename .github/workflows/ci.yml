# Integration continue : a chaque push et chaque pull request.
# Verifie que tout compile, que les tests passent, que les fronts se construisent,
# que les images Docker se construisent et qu'aucun secret n'est dans Git.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  secrets:
    name: Aucun secret dans Git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recherche de cles et mots de passe
        run: |
          if git ls-files -z | xargs -0 grep -nIE '(tsk|tpr)_[0-9a-f]{16,}|MAIL_PASSWORD=[A-Za-z0-9]{8,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' ; then
            echo "::error::Un secret est present dans le depot Git. Retire-le et change la cle concernee."; exit 1
          fi
          echo "Aucun secret detecte."

  backend:
    name: Backend (compilation + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilation et tests de tous les modules
        run: mvn -B -ntp verify
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

  admin:
    name: Dashboard admin (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci || npm install --no-audit --no-fund
        working-directory: admin-dashboard
      - run: npm run build
        working-directory: admin-dashboard
        env:
          VITE_API_BASE_URL: https://76-13-37-17.nip.io

  mobile:
    name: App mobile et web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci || npm install --no-audit --no-fund
        working-directory: mobile-app
      - run: npx expo export -p web
        working-directory: mobile-app

  docker:
    name: Images Docker (build)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Jars
        run: mvn -B -ntp -q -DskipTests package
      - name: Images des microservices
        run: |
          for s in discovery-service gateway-service compte-service media-service musique-service live-service votes-service boutique-service paiement-service; do
            docker build -t myaddictive/$s:ci $s
          done
          # config-service : contexte = racine (il embarque config-repo/)
          docker build -f config-service/Dockerfile -t myaddictive/config-service:ci .
          docker build --build-arg VITE_API_BASE_URL=https://76-13-37-17.nip.io -t myaddictive/admin-dashboard:ci admin-dashboard
