# Version de demarrage, utilisee UNIQUEMENT avant d'avoir obtenu le
# certificat SSL (le fichier nginx-proxy.conf definitif exige des fichiers
# de certificat qui n'existent pas encore a ce stade). Voir DEPLOIEMENT.md.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://gateway-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://admin-dashboard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
