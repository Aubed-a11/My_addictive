# Proxy public : recoit tout le trafic du VPS (ports 80/443), route vers la
# gateway (API) ou le dashboard admin selon le chemin, et termine le SSL.
#
# IMPORTANT : au tout premier lancement, avant d'avoir obtenu un certificat
# Let's Encrypt, seul le bloc "port 80" fonctionne (le bloc 443 fera
# planter Nginx s'il ne trouve pas encore les fichiers de certificat) : voir
# DEPLOIEMENT.md pour la procedure exacte (demarrer d'abord sans le bloc 443,
# obtenir le certificat, puis reactiver ce fichier complet).

server {
    listen 80;
    server_name VOTRE_DOMAINE.com;

    # Requis par Certbot pour valider le domaine avant de delivrer un certificat.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirige tout le reste vers HTTPS une fois le certificat obtenu.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name VOTRE_DOMAINE.com;

    ssl_certificate     /etc/letsencrypt/live/VOTRE_DOMAINE.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/VOTRE_DOMAINE.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    # API (gateway) : tout ce qui commence par /api/ ou /h2-console
    location /api/ {
        proxy_pass http://gateway-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard admin (application React statique)
    location / {
        proxy_pass http://admin-dashboard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
