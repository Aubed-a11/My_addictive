# Docker Compose charge automatiquement ce fichier en plus de docker-compose.yml (qui vit sur le VPS).
#
# ARCHITECTURE : les 7 services metier (compte, media, musique, live, votes, boutique, paiement)
# sont regroupes dans UN SEUL programme : "app-service". Les anciens services restent definis dans
# docker-compose.yml mais sont desactives ici (profil "ancien") : ils ne demarrent plus.
# Un seul fichier SQLite (volume data_db) pour toutes les tables, prefixees par domaine.
volumes:
  data_db:
  # Deja declares dans docker-compose.yml ; repetes ici pour que ce fichier soit valide seul.
  data_compte:

services:
  app-service:
    build:
      context: ./app-service
    image: myaddictive-app-service
    # Cles e-mail, KKiaPay, JWT, administrateur... : tout vient de .env.production (jamais dans Git).
    env_file:
      - .env.production
    environment:
      SERVER_PORT: "8080"
      APP_DB_PATH: /app/shared-db/myaddictive.db
      COMPTE_UPLOADS_PATH: /app/data/uploads/
      MEDIA_UPLOADS_PATH: /app/uploads/
      # Memoire plafonnee : un seul programme Java au lieu de sept.
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m"
    volumes:
      - data_db:/app/shared-db
      - data_compte:/app/data
      # Dossier reel des fichiers medias sur le serveur (deja utilise par l'ancien service media) :
      - ./media-service/uploads:/app/uploads
    # Meme reseau Docker que la passerelle (defini dans docker-compose.yml) : sinon elle ne le joint pas.
    networks: [myaddictive]
    mem_limit: 900m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s

  # --- Anciens microservices : desactives (profil "ancien"), remplaces par app-service ---
  compte-service:
    profiles: ["ancien"]
  media-service:
    profiles: ["ancien"]
  musique-service:
    profiles: ["ancien"]
  live-service:
    profiles: ["ancien"]
  votes-service:
    profiles: ["ancien"]
  boutique-service:
    profiles: ["ancien"]
  paiement-service:
    profiles: ["ancien"]

  # Le nginx du serveur (partage avec d'autres sites) occupe deja les ports 80 et 443 : le conteneur
  # "proxy" de ce projet est donc desactive. Le nginx du serveur envoie My Addictive vers la passerelle.
  proxy:
    profiles: ["hors-service"]

  gateway-service:
    restart: unless-stopped
    # Port visible seulement depuis le serveur (le nginx du serveur y accede) : plus d'acces direct depuis Internet.
    ports: !override
      - "127.0.0.1:8090:8090"
    # Remplace les dependances du docker-compose.yml de base : elles pouvaient pointer vers les
    # anciens services (desormais desactives), ce qui fait echouer tout "docker compose up".
    depends_on: !override
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
      app-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://localhost:8090/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  config-service:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
